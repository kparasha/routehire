openapi: 3.1.0
info:
  title: RouteHire API
  version: 0.2.0
  description: Local waste hiring — demand index, phone intake, hauler fees
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Health check
  /jobs:
    get:
      summary: Search demand index
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: schedule, in: query, schema: { type: string, enum: [home_daily, regional, otr] } }
        - { name: cdl_class, in: query, schema: { type: string } }
        - { name: role_family, in: query, schema: { type: string } }
        - { name: equipment, in: query, schema: { type: string } }
        - { name: bonus_min, in: query, schema: { type: number } }
        - { name: urgency_min, in: query, schema: { type: number } }
        - { name: trending, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string } }
  /jobs/trends:
    get:
      summary: Market trends
  /jobs/refresh:
    post:
      summary: Trigger ingest (Bearer CRON_SECRET)
  /intake/sessions:
    post:
      summary: Create intake session
  /intake/sessions/{id}:
    get:
      summary: Get session progress
    patch:
      summary: Append answer
  /intake/sessions/{id}/complete:
    post:
      summary: Complete intake, build resume, match jobs
  /hauler/shortlist:
    get:
      summary: Opt-in talent pool
  /hires:
    post:
      summary: Record hire, contingent fee
